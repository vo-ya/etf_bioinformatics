<title id="t">An overlap connects two read nodes</title><desc id="d">Reads ATGAC and GACCT have a maximum exact suffix-prefix overlap GAC of three bases. Joining without duplicating that overlap gives ATGACCT. Reverse overlap is zero. The matrix omits self-comparisons.</desc><rect width="100%" height="100%" fill="#fcfcfa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1e3a8a"/></marker></defs><g font-family="Inter, sans-serif" fill="#525252"><text x="35" y="32" font-size="15" font-weight="600" fill="#1e3a8a">READS</text><text x="235" y="32" font-size="15" font-weight="600" fill="#1e3a8a">EXACT SUFFIX → PREFIX</text><text x="565" y="32" font-size="15" font-weight="600" fill="#1e3a8a">OVERLAP GRAPH</text><g font-family="monospace" font-size="20" fill="#0a0a0a"><text x="35" y="90">R1 ATGAC</text><text x="35" y="130">R2 GACCT</text></g><rect x="240" y="70" width="250" height="130" rx="4" fill="#f4f3ee" stroke="#c4c1b6"/><g font-family="monospace" font-size="18"><text x="315" y="96">R1</text><text x="405" y="96">R2</text><text x="255" y="137">R1</text><text x="255" y="177">R2</text><text x="322" y="137">—</text><text x="412" y="137" fill="#1e3a8a" font-weight="700">3</text><text x="322" y="177">0</text><text x="412" y="177">—</text></g><circle cx="600" cy="125" r="30" fill="#f4f3ee" stroke="#0a0a0a"/><circle cx="775" cy="125" r="30" fill="#f4f3ee" stroke="#0a0a0a"/><text x="600" y="132" text-anchor="middle" font-family="monospace" font-size="20">R1</text><text x="775" y="132" text-anchor="middle" font-family="monospace" font-size="20">R2</text><line x1="633" y1="125" x2="740" y2="125" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="687" y="108" text-anchor="middle" font-size="16">3 bases: GAC</text><text x="35" y="246" font-size="15">Keep the shared GAC once:</text><g font-family="monospace" font-size="22" fill="#0a0a0a"><text x="95" y="284">ATGAC</text><text x="121.4" y="316">GACCT</text><text x="95" y="357" fill="#1e3a8a">ATGACCT</text></g><text x="400" y="285" font-size="15">R1 suffix GAC = R2 prefix GAC.</text><text x="400" y="315" font-size="15">One node per read; edge label = overlap length.</text><text x="400" y="345" font-size="15">A consistent overlap is candidate evidence,</text><text x="400" y="370" font-size="15">not proof of the unique true sequence.</text></g></svg>