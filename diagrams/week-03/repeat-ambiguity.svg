<title id="t">Two valid graph orders leave an ambiguity</title><desc id="d">ATGATCAT and ATCATGAT contain the same six three-mers exactly once: ATG TGA GAT ATC TCA CAT. Two directed cycles share AT. Traversing the left cycle then right or right then left yields the two strings. GATC occurs only in the first sequence.</desc><rect width="100%" height="100%" fill="#fcfcfa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1e3a8a"/></marker></defs><g font-family="Inter, sans-serif" fill="#525252"><text x="35" y="32" font-size="18" font-weight="600" fill="#14243b">Two linear sequences share the same six 3-mer observations</text><text x="35" y="68" font-family="monospace" font-size="19">A: ATGATCAT</text><text x="470" y="68" font-family="monospace" font-size="19">B: ATCATGAT</text><line x1="399.4308514978769" y1="195.5381207017238" x2="254.39029206488846" y2="150.64461421056072" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="325.0" y="162.5" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">ATG</text><line x1="220.0" y1="172.0" x2="220.0" y2="249.0" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="185.0" y="202.5" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">TGA</text><line x1="249.90360751772698" y1="273.6081495170564" x2="396.35844154255716" y2="217.81583179331156" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="325.0" y="235.0" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">GAT</text><line x1="460.5691485021231" y1="195.5381207017238" x2="605.6097079351116" y2="150.64461421056072" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="535.0" y="162.5" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">ATC</text><line x1="640.0" y1="172.0" x2="640.0" y2="249.0" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="605.0" y="202.5" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">TCA</text><line x1="610.096392482273" y1="273.6081495170564" x2="463.64155845744284" y2="217.81583179331156" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow)"/><text x="535.0" y="235.0" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">CAT</text><circle cx="430" cy="205" r="30" fill="#f4f3ee" stroke="#0a0a0a" stroke-width="1.5"/><text x="430" y="211" text-anchor="middle" font-family="monospace" font-size="20" fill="#0a0a0a">AT</text><circle cx="220" cy="140" r="30" fill="#f4f3ee" stroke="#0a0a0a" stroke-width="1.5"/><text x="220" y="146" text-anchor="middle" font-family="monospace" font-size="20" fill="#0a0a0a">TG</text><circle cx="220" cy="285" r="30" fill="#f4f3ee" stroke="#0a0a0a" stroke-width="1.5"/><text x="220" y="291" text-anchor="middle" font-family="monospace" font-size="20" fill="#0a0a0a">GA</text><circle cx="640" cy="140" r="30" fill="#f4f3ee" stroke="#0a0a0a" stroke-width="1.5"/><text x="640" y="146" text-anchor="middle" font-family="monospace" font-size="20" fill="#0a0a0a">TC</text><circle cx="640" cy="285" r="30" fill="#f4f3ee" stroke="#0a0a0a" stroke-width="1.5"/><text x="640" y="291" text-anchor="middle" font-family="monospace" font-size="20" fill="#0a0a0a">CA</text><text x="35" y="350" font-size="15">Start at AT: left cycle then right spells A; right cycle then left spells B.</text><text x="35" y="376" font-size="14">Longer observation GATC supports A over B. The graph cycle does not prove a circular molecule.</text></g></svg>