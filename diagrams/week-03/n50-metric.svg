<title id="t">Compare N50 and L50 without assuming correctness</title><desc id="d">Assembly A lengths eight seven five total twenty; running totals eight fifteen twenty cross half at the second contig, so N50 seven and L50 two. Assembly B lengths twelve eight total twenty crosses half on its first contig, so N50 twelve and L50 one. Lengths alone do not show correctness.</desc><rect width="100%" height="100%" fill="#fcfcfa"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1e3a8a"/></marker></defs><g font-family="Inter, sans-serif" fill="#525252"><text x="35" y="30" font-size="19" font-weight="600" fill="#14243b">N50 uses half of each assembly's own total length</text><text x="45" y="66" font-size="17" font-weight="600" fill="#1e3a8a">Assembly A: total 20, half = 10</text><rect x="80" y="90" width="160" height="20" fill="#f4f3ee" stroke="#1e3a8a" stroke-width="2"/><text x="249" y="106" font-family="monospace" font-size="15">8</text><text x="55" y="106" text-anchor="end" font-size="14">1</text><rect x="80" y="128" width="140" height="20" fill="#eef2ff" stroke="#1e3a8a" stroke-width="2"/><text x="229" y="144" font-family="monospace" font-size="15">7</text><text x="55" y="144" text-anchor="end" font-size="14">2</text><rect x="80" y="166" width="100" height="20" fill="#f4f3ee" stroke="#1e3a8a" stroke-width="2"/><text x="189" y="182" font-family="monospace" font-size="15">5</text><text x="55" y="182" text-anchor="end" font-size="14">3</text><text x="45" y="224" font-size="18" font-weight="600" fill="#1e3a8a">N50 = 7 bases; L50 = 2 contigs</text><text x="485" y="66" font-size="17" font-weight="600" fill="#0d7377">Assembly B: total 20, half = 10</text><rect x="520" y="90" width="240" height="20" fill="#eef2ff" stroke="#0d7377" stroke-width="2"/><text x="769" y="106" font-family="monospace" font-size="15">12</text><text x="495" y="106" text-anchor="end" font-size="14">1</text><rect x="520" y="128" width="160" height="20" fill="#f4f3ee" stroke="#0d7377" stroke-width="2"/><text x="689" y="144" font-family="monospace" font-size="15">8</text><text x="495" y="144" text-anchor="end" font-size="14">2</text><text x="485" y="224" font-size="18" font-weight="600" fill="#0d7377">N50 = 12 bases; L50 = 1 contig</text><text x="35" y="264" font-size="15">Cumulative bases after sorting:</text><line x1="100" y1="435" x2="760" y2="435" stroke="#525252"/><line x1="100" y1="290" x2="100" y2="435" stroke="#525252"/><line x1="100" y1="362.5" x2="760" y2="362.5" stroke="#525252" stroke-dasharray="4 4"/><text x="90" y="367" text-anchor="end" font-size="13">10</text><text x="90" y="294" text-anchor="end" font-size="13">20</text><text x="90" y="439" text-anchor="end" font-size="13">0</text><path d="M100 435 L300 377.0 L500 326.25 L700 290.0" stroke="#1e3a8a" stroke-width="2.5" fill="none"/><path d="M100 435 L300 348.0 L500 290.0" stroke="#0d7377" stroke-width="2.5" fill="none"/><text x="100" y="453" text-anchor="middle" font-size="13">0</text><text x="300" y="453" text-anchor="middle" font-size="13">1</text><text x="500" y="453" text-anchor="middle" font-size="13">2</text><text x="700" y="453" text-anchor="middle" font-size="13">3</text><text x="800" y="365" text-anchor="end" font-size="13">half</text><text x="35" y="477" font-size="15">Higher N50 means greater reported continuity here. Sequence correctness and completeness remain unknown.</text></g></svg>