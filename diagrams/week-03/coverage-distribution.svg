<title id="t">Same average depth, different breadth</title><desc id="d">Two chosen arrangements use three reads of length four on a twelve-base linear reference. Spread starts zero four eight cover every base once. Clustered starts zero zero zero cover four bases three times and eight bases zero times. Both means equal one.</desc><rect width="100%" height="100%" fill="#fcfcfa"/>
