ize="16" fill="#0a0a0a">1</text><text x="35" y="171" font-size="14">Depth:</text><text x="35" y="240" font-size="17" fill="#1e3a8a">Clustered: 4 of 12 positions covered (33.3%)</text><line x1="100" y1="263" x2="760" y2="263" stroke="#0a0a0a" stroke-width="5"/><line x1="100" y1="285" x2="320" y2="285" stroke="#1e3a8a" stroke-width="3"/><line x1="100" y1="301" x2="320" y2="301" stroke="#1e3a8a" stroke-width="3"/><line x1="100" y1="317" x2="320" y2="317" stroke="#1e3a8a" stroke-width="3"/><text x="127.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#0a0a0a">3</text><text x="182.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#0a0a0a">3</text><text x="237.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#0a0a0a">3</text><text x="292.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#0a0a0a">3</text><text x="347.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="402.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="457.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="512.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="567.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="622.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="677.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="732.5" y="346" text-anchor="middle" font-family="monospace" font-size="16" fill="#b91c1c">0</text><text x="35" y="346" font-size="14">Depth:</text><text x="35" y="388" font-size="16">Both: N = 3, L = 4, G = 12 → mean N × L / G = 1×. Chosen arrangements, not random draws.</text></g></svg>