<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="460" viewBox="0 0 1152 460" role="img" aria-labelledby="title desc">
<title id="title">Query coverage and average read depth measure different things</title>
<desc id="desc">A search hit includes six of twelve query bases, giving 50 percent query coverage. Below, three four-base reads cover a twelve-base reference. Spread reads give depth one everywhere and cover all positions. Clustered reads give depth three at four positions and zero at eight positions. Both arrangements have twelve aligned read bases divided by twelve reference bases, or one times average depth.</desc>
