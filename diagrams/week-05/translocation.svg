<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc"><title id="title">A reciprocal translocation</title><desc id="desc">Two chromosomes exchange terminal regions C and Z without net sequence loss in this simplified example.</desc><g font-family="Arial,sans-serif"><text x="10" y="41" font-size="22" fill="#14243b" text-anchor="start">Chr 1 reference</text><rect x="225" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="41" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="41" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="41" font-size="25" fill="white" text-anchor="middle">C→</text><text x="10" y="106" font-size="22" fill="#14243b" text-anchor="start">Chr 2 reference</text><rect x="225" y="75" width="100" height="45" rx="3" fill="#946018"/><text x="275" y="106" font-size="25" fill="white" text-anchor="middle">X→</text><rect x="340" y="75" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="106" font-size="25" fill="white" text-anchor="middle">Y→</text><rect x="455" y="75" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="106" font-size="25" fill="white" text-anchor="middle">Z→</text><text x="10" y="206" font-size="22" fill="#14243b" text-anchor="start">Derivative 1</text><rect x="225" y="175" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="206" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="175" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="206" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="175" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="206" font-size="25" fill="white" text-anchor="middle">Z→</text><text x="10" y="271" font-size="22" fill="#14243b" text-anchor="start">Derivative 2</text><rect x="225" y="240" width="100" height="45" rx="3" fill="#946018"/><text x="275" y="271" font-size="25" fill="white" text-anchor="middle">X→</text><rect x="340" y="240" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="271" font-size="25" fill="white" text-anchor="middle">Y→</text><rect x="455" y="240" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="271" font-size="25" fill="white" text-anchor="middle">C→</text><text x="15" y="345" font-size="24" fill="#14243b" text-anchor="start">Reciprocal exchange: new B–Z and Y–C joins; no net loss in this toy.</text></g></svg>
