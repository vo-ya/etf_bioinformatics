<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc"><title id="title">An inversion reverses order and orientation</title><desc id="desc">A B C D E becomes A B reverse D reverse C E. Copy number can remain unchanged.</desc><g font-family="Arial,sans-serif"><text x="10" y="56" font-size="22" fill="#14243b" text-anchor="start">Reference</text><rect x="225" y="25" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="56" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="25" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="56" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="25" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="56" font-size="25" fill="white" text-anchor="middle">C→</text><rect x="570" y="25" width="100" height="45" rx="3" fill="#0d7377"/><text x="620" y="56" font-size="25" fill="white" text-anchor="middle">D→</text><rect x="685" y="25" width="100" height="45" rx="3" fill="#0d7377"/><text x="735" y="56" font-size="25" fill="white" text-anchor="middle">E→</text><text x="10" y="146" font-size="22" fill="#14243b" text-anchor="start">Inversion</text><rect x="225" y="115" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="146" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="115" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="146" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="115" width="100" height="45" rx="3" fill="#ad4936"/><text x="505" y="146" font-size="25" fill="white" text-anchor="middle">D←</text><rect x="570" y="115" width="100" height="45" rx="3" fill="#ad4936"/><text x="620" y="146" font-size="25" fill="white" text-anchor="middle">C←</text><rect x="685" y="115" width="100" height="45" rx="3" fill="#0d7377"/><text x="735" y="146" font-size="25" fill="white" text-anchor="middle">E→</text><text x="20" y="230" font-size="25" fill="#14243b" text-anchor="start">The C–D segment is reverse-complemented; both orientations flip.</text><text x="20" y="280" font-size="25" fill="#14243b" text-anchor="start">A balanced inversion can preserve copy number and ordinary depth.</text><text x="20" y="330" font-size="25" fill="#14243b" text-anchor="start">Look for new junctions and changed alignment orientations.</text></g></svg>
