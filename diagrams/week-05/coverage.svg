<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc"><title id="title">Half-depth region in a synthetic sample</title><desc id="desc">The four windows in [400,800) average depth 10; eight flanking windows average 20. Control depth is 20.</desc><g font-family="Arial,sans-serif"><text x="15" y="30" font-size="24" fill="#14243b" text-anchor="start">Mean depth in equal 100-base windows</text><rect x="360" y="70" width="260" height="220" rx="3" fill="#fbf1df"/><line x1="100" y1="290" x2="900" y2="290" stroke="#14243b" stroke-width="3" stroke-dasharray=""/><line x1="100" y1="60" x2="100" y2="290" stroke="#14243b" stroke-width="3" stroke-dasharray=""/><text x="85" y="297" font-size="20" fill="#14243b" text-anchor="end">0</text><text x="85" y="217" font-size="20" fill="#14243b" text-anchor="end">10</text><text x="85" y="137" font-size="20" fill="#14243b" text-anchor="end">20</text><rect x="102" y="130" width="61" height="160" rx="3" fill="#0d7377"/><rect x="167" y="114" width="61" height="176" rx="3" fill="#0d7377"/><rect x="232" y="146" width="61" height="144" rx="3" fill="#0d7377"/><rect x="297" y="130" width="61" height="160" rx="3" fill="#0d7377"/><rect x="362" y="210" width="61" height="80" rx="3" fill="#0d7377"/><rect x="427" y="218" width="61" height="72" rx="3" fill="#0d7377"/><rect x="492" y="202" width="61" height="88" rx="3" fill="#0d7377"/><rect x="557" y="210" width="61" height="80" rx="3" fill="#0d7377"/><rect x="622" y="130" width="61" height="160" rx="3" fill="#0d7377"/><rect x="687" y="146" width="61" height="144" rx="3" fill="#0d7377"/><rect x="752" y="114" width="61" height="176" rx="3" fill="#0d7377"/><rect x="817" y="130" width="61" height="160" rx="3" fill="#0d7377"/><line x1="100" y1="130" x2="880" y2="130" stroke="#ad4936" stroke-width="3" stroke-dasharray="8 5"/><text x="100.0" y="322" font-size="22" fill="#14243b" text-anchor="middle">0</text><text x="360.0" y="322" font-size="22" fill="#14243b" text-anchor="middle">400</text><text x="620.0" y="322" font-size="22" fill="#14243b" text-anchor="middle">800</text><text x="880.0" y="322" font-size="22" fill="#14243b" text-anchor="middle">1200</text><text x="500" y="360" font-size="24" fill="#14243b" text-anchor="middle">Reference position (0-based boundaries)</text><text x="500" y="395" font-size="24" fill="#14243b" text-anchor="middle">Region 10 / flanks 20 = 0.5; dashed control depth = 20.</text></g></svg>
