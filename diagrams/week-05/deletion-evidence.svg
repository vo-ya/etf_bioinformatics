<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Pair and split-read evidence for a deletion</title><desc id="desc">A typical 300-base fragment spans 700 reference bases across a 400-base deletion. A split read joins the flanks at boundaries 400 and 800.</desc><g font-family="Arial,sans-serif"><text x="15" y="30" font-size="26" fill="#14243b" text-anchor="start">A 400-base deletion on one sample chromosome</text><rect x="100" y="80" width="260" height="35" rx="3" fill="#0d7377"/><rect x="360" y="80" width="260" height="35" rx="3" fill="#ead3c9"/><rect x="620" y="80" width="260" height="35" rx="3" fill="#0d7377"/><text x="100.0" y="65" font-size="22" fill="#14243b" text-anchor="middle">0</text><text x="360.0" y="65" font-size="22" fill="#14243b" text-anchor="middle">400</text><text x="620.0" y="65" font-size="22" fill="#14243b" text-anchor="middle">800</text><text x="880.0" y="65" font-size="22" fill="#14243b" text-anchor="middle">1200</text><text x="490" y="105" font-size="21" fill="#14243b" text-anchor="middle">deleted region</text><text x="10" y="160" font-size="22" fill="#14243b" text-anchor="start">Pair</text><line x1="262.5" y1="160" x2="717.5" y2="160" stroke="#14243b" stroke-width="3" stroke-dasharray="7 5"/><rect x="262.5" y="145" width="32.5" height="25" rx="3" fill="#0d7377"/><rect x="685" y="145" width="32.5" height="25" rx="3" fill="#0d7377"/><text x="278" y="165" font-size="24" fill="white" text-anchor="middle">→</text><text x="701" y="165" font-size="24" fill="white" text-anchor="middle">←</text><text x="100" y="210" font-size="25" fill="#14243b" text-anchor="start">Reference outer span: 950 − 250 = 700 bp</text><text x="100" y="247" font-size="25" fill="#14243b" text-anchor="start">Sample fragment span: 700 − 400 = 300 bp (typical library span)</text><text x="10" y="302" font-size="22" fill="#14243b" text-anchor="start">Split read</text><rect x="347" y="280" width="13" height="28" rx="3" fill="#ad4936"/><rect x="620" y="280" width="13" height="28" rx="3" fill="#ad4936"/><line x1="360" y1="294" x2="620" y2="294" stroke="#ad4936" stroke-width="3" stroke-dasharray="6 5"/><text x="100" y="355" font-size="25" fill="#14243b" text-anchor="start">One 40-base read: [380,400) joined to [800,820)</text><text x="100" y="393" font-size="23" fill="#14243b" text-anchor="start">Independent reads spanning this join help locate the breakends.</text></g></svg>
