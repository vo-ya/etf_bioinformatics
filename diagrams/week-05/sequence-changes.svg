<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Sequence loss and gain</title><desc id="desc">Reference A B C D E; deletion removes C; duplication repeats C; insertion adds X.</desc><g font-family="Arial,sans-serif"><text x="10" y="41" font-size="22" fill="#14243b" text-anchor="start">Reference</text><rect x="225" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="41" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="41" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="41" font-size="25" fill="white" text-anchor="middle">C→</text><rect x="570" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="620" y="41" font-size="25" fill="white" text-anchor="middle">D→</text><rect x="685" y="10" width="100" height="45" rx="3" fill="#0d7377"/><text x="735" y="41" font-size="25" fill="white" text-anchor="middle">E→</text><text x="10" y="106" font-size="22" fill="#14243b" text-anchor="start">Deletion</text><rect x="225" y="75" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="106" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="75" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="106" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="75" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="106" font-size="25" fill="white" text-anchor="middle">D→</text><rect x="570" y="75" width="100" height="45" rx="3" fill="#0d7377"/><text x="620" y="106" font-size="25" fill="white" text-anchor="middle">E→</text><text x="10" y="171" font-size="22" fill="#14243b" text-anchor="start">Duplication</text><rect x="225" y="140" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="171" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="140" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="171" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="140" width="100" height="45" rx="3" fill="#0d7377"/><text x="505" y="171" font-size="25" fill="white" text-anchor="middle">C→</text><rect x="570" y="140" width="100" height="45" rx="3" fill="#0d7377"/><text x="620" y="171" font-size="25" fill="white" text-anchor="middle">C→</text><rect x="685" y="140" width="100" height="45" rx="3" fill="#0d7377"/><text x="735" y="171" font-size="25" fill="white" text-anchor="middle">D→</text><rect x="800" y="140" width="100" height="45" rx="3" fill="#0d7377"/><text x="850" y="171" font-size="25" fill="white" text-anchor="middle">E→</text><text x="10" y="236" font-size="22" fill="#14243b" text-anchor="start">Insertion</text><rect x="225" y="205" width="100" height="45" rx="3" fill="#0d7377"/><text x="275" y="236" font-size="25" fill="white" text-anchor="middle">A→</text><rect x="340" y="205" width="100" height="45" rx="3" fill="#0d7377"/><text x="390" y="236" font-size="25" fill="white" text-anchor="middle">B→</text><rect x="455" y="205" width="100" height="45" rx="3" fill="#946018"/><text x="505" y="236" font-size="25" fill="white" text-anchor="middle">X→</text><rect x="570" y="205" width="100" height="45" rx="3" fill="#0d7377"/><text x="620" y="236" font-size="25" fill="white" text-anchor="middle">C→</text><rect x="685" y="205" width="100" height="45" rx="3" fill="#0d7377"/><text x="735" y="236" font-size="25" fill="white" text-anchor="middle">D→</text><rect x="800" y="205" width="100" height="45" rx="3" fill="#0d7377"/><text x="850" y="236" font-size="25" fill="white" text-anchor="middle">E→</text><text x="10" y="300" font-size="22" fill="#14243b" text-anchor="start">Blocks represent oriented regions, not individual bases.</text><text x="10" y="335" font-size="22" fill="#14243b" text-anchor="start">Loss, gain, and a new junction can provide different kinds of evidence.</text></g></svg>
